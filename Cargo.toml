[package]
name = "bessemer"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-2.0-only"
description = "Read and edit SolidWorks document containers"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
quick-xml = { version = "=0.42.0", default-features = false }
rusqlite = { version = "=0.40.2", default-features = false, features = ["libsqlite3-sys", "bundled", "serialize", "limits", "hooks"] }

[workspace]
members = [".", "xtask"]

[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true
