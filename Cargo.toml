[package]
name = "bessemer"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-2.0-only"
description = "Read and edit SolidWorks document containers"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
quick-xml = { version = "=0.42.0", default-features = false }

[workspace]
members = [".", "xtask"]
